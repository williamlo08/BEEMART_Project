
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BeeMart/Login</title>
</head>
<body>

    <div class="container">
        <h1>BeeMart Login</h1>

        <form id="loginForm">
            <h4>Username</h4>
            <input type="text" id="username" required>

            <h4>Password</h4>
            <input type="password" id="password" required>

            <h4>Role</h4>
            <select id="role" required>
                <option value="" disabled selected>Choose role</option>
                <option value="Admin">Admin</option>
                <option value="Cashier">Kasir</option>
            </select>

            <button type="submit">Login</button>
            <p><b>Belum Punya akun? <a href="register.html">Register</a></b></p>
        </form>
    </div>

<script>
    const API_BASE = 'http://localhost:5046/api/v1';

    function showToast(message, type = 'error') {
        const colors = { success: '#1d83d4', error: '#f84131', info: '#005499' };
        const t = document.createElement('div');
        t.style.cssText = `position:fixed;top:20px;right:20px;padding:12px 20px;background:${colors[type]};color:white;border-radius:8px;font-weight:bold;z-index:9999;`;
        t.textContent = message;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value; // Pastikan value di HTML adalah "Admin" dan "Cashier"

        try {
            const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, role })
            });
            const data = await res.json();

            if (!res.ok) throw new Error(data.message || 'Invalid login');

            // Simpan Token & Data User
            localStorage.setItem('currentUser', JSON.stringify(data));
            showToast(`Selamat datang, ${data.fullName}`, 'success');
            
            setTimeout(() => {
                window.location.href = data.role === 'Cashier' ? 'cashier.html' : 'admin.html';
            }, 700);
        } catch (err) {
            showToast(err.message);
        }
    });
</script>
</body>
</html>
