<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BeeMart/Admin</title>
</head>
<body class="cashier-page">
    <nav class="navbar">
        <p class="logo"><span class="logo-bee">Bee</span>Mart</p>
        <div class="nav-right">
            <span id="headerInfo" style="color: white; font-size: 14px; margin-right: 15px; font-weight: bold;"></span>
            <a href="#" class="logout-btn" onclick="logout();return false;">Logout</a>
        </div>
    </nav>
    <div class="kotak">
        <div class="tab-switch">
            <button class="tab-btn active" id="tabNew" onclick="switchTab('new')">New Transaction</button>
            <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">History Transaction</button>
        </div>

        <div id="contentNew" style="display: block;">
            <div class="invoice-row">
                <span class="invoice-label">Invoice No:</span>
                <span class="invoice-no" id="invoiceNo">Memuat...</span>
            </div>
            <div class="text-cari">
                <p style="font-size:14px">Cari Barang (Ketik: Apel / Susu, lalu tekan enter)</p>
            </div>

            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Ketik nama barang..." onkeydown="if(event.key==='Enter'){event.preventDefault();cariProduk();}">
            </div>

            <div class="produk-list" id="produkList"></div>

            <div id="panelPilih" class="panel-pilih" style="display:none;"></div>

            <div class="daftar-belanja">
                <h4>Daftar Belanjaan</h4>
                <div id="cartList" class="cart-list">
                    <p class="empty-cart">Belum ada barang dipilih.</p>
                </div>
            </div>

            <div class="total-row">
                <span style="color: var(--blue);">Total:</span>
                <span id="totalHarga">Rp 0</span>
            </div>
            <div class="metode-row">
                <label for="metodePembayaran" class="metode-label">Metode Pembayaran:</label>
                <select id="metodePembayaran" class="metode-select"></select>
            </div>

            <button class="bayar-btn" onclick="bayar()">Submit Transaksi</button>
        </div>

        <div id="contentHistory" style="display:none;">
            <div class="history-header">
                <p class="history-title">Pencarian Data Transaksi <span class="history-kasir" id="labelKasir">(Admin: -)</span></p>
                <div class="history-filter">
                    <label for="filterTanggal" class="history-filter-label">Pilih Tanggal:</label>
                    <div class="history-date-wrap">
                        <input type="text" id="filterTanggal" class="history-date-input" placeholder="dd / mm / yyyy">
                        <input type="date" id="filterTanggalPicker" class="history-date-picker">
                    </div>
                    <button class="history-cari-btn" onclick="cariHistory()">Cari Data</button>
                </div>
            </div>
            <div class="history-list" id="historyList">
                <p class="empty-cart">Memuat data...</p>
            </div>
            <div class="history-pagination" id="historyPagination"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5046/api/v1';
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));

        if (!currentUser || !currentUser.token) {
            window.location.href = 'index.html';
        } else {
            if (currentUser.role !== 'Admin') {
                alert("Akses Ditolak: Halaman ini hanya untuk Admin!");
                window.location.href = 'cashier.html';
            }
        }

        const authHeaders = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentUser.token}`
        };

        function showToast(message, type = 'info') {
            const colors = { success: '#1d83d4', error: '#f84131', info: '#005499' };
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed; top: 20px; right: 20px; padding: 12px 20px;
                background: ${colors[type] || colors.info}; color: white; border-radius: 8px;
                font-weight: bold; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                z-index: 9999; max-width: 350px; transition: opacity 0.3s;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function updateHeader() {
            const header = document.getElementById('headerInfo');
            if (!currentUser || !header) return;

            const isHistoryTab = document.getElementById('tabHistory').classList.contains('active');
            header.innerHTML = ''; 

            if (isHistoryTab) {
                const spanRole = document.createElement('span');
                spanRole.innerHTML = `Role : <span style="color: #FFD700; font-weight: bold;">${currentUser.role}</span> | Login : `;
                const spanName = document.createElement('span');
                spanName.textContent = currentUser.username; 
                
                header.appendChild(spanRole);
                header.appendChild(spanName);
            } else {
                const sekarang = new Date();
                const tgl = `${String(sekarang.getDate()).padStart(2, '0')}/${String(sekarang.getMonth() + 1).padStart(2, '0')}/${sekarang.getFullYear()}`;
                const jam = `${String(sekarang.getHours()).padStart(2, '0')}:${String(sekarang.getMinutes()).padStart(2, '0')}`;
                
                header.textContent = `${tgl}, ${jam} | ${currentUser.role} : ${currentUser.username}`;
            }
        }
        
        setInterval(updateHeader, 1000);
        updateHeader();

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        let produkData = [];
        let cart = [];
        let produkDipilih = null;

        async function loadNextInvoice() {
            try {
                const res = await fetch(`${API_BASE}/transactions/next-invoice`, { headers: authHeaders });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('invoiceNo').textContent = data.invoiceNo;
                }
            } catch (err) { 
                console.error('Gagal load invoice', err); 
                document.getElementById('invoiceNo').textContent = 'Gagal memuat';
            }
        }

        async function loadPaymentMethods() {
            try {
                const res = await fetch(`${API_BASE}/payment-methods`, { headers: authHeaders });
                if (!res.ok) throw new Error('Gagal memuat metode pembayaran');
                const methods = await res.json();
                document.getElementById('metodePembayaran').innerHTML = methods.map(m =>
                    `<option value="${m.idPaymentMethod}">${m.methodName}</option>`
                ).join('');
            } catch (err) { showToast(err.message, 'error'); }
        }

        function switchTab(tab) {
            const newContent = document.getElementById('contentNew');
            const historyContent = document.getElementById('contentHistory');
            const tabNew = document.getElementById('tabNew');
            const tabHistory = document.getElementById('tabHistory');

            if (tab === 'new') {
                newContent.style.display = 'block'; historyContent.style.display = 'none';
                tabNew.classList.add('active'); tabHistory.classList.remove('active');
            } else {
                newContent.style.display = 'none'; historyContent.style.display = 'block';
                tabNew.classList.remove('active'); tabHistory.classList.add('active');

                document.getElementById('historyList').innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted); font-style: italic;">Silakan pilih tanggal atau ketik tanggal, lalu klik "Cari Data".</div>';
                document.getElementById('historyPagination').innerHTML = '';
            }
            updateHeader();
        }

        function renderTabelProduk(filtered) {
            const list = document.getElementById('produkList');
            if (filtered.length === 0) {
                list.innerHTML = '<p class="empty-cart">Barang tidak ditemukan.</p>'; return;
            }

            const rows = filtered.map(p => `
                <tr>
                    <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${p.name}</td>
                    <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${p.weight} g</td>
                    <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${p.stock}</td>
                    <td style="padding:8px;text-align:left;border:1px solid var(--blue);">Rp ${p.price.toLocaleString('id-ID')}</td>
                    <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${p.discount}%</td>
                    <td style="padding:8px;text-align:center;border:1px solid var(--blue);"><button class="btn-pilih" onclick="pilihProduk('${p.idProduct}')">Pilih</button></td>
                </tr>
            `).join('');

            list.innerHTML = `
                <table style="width:100%;border-collapse:collapse;font-size:14px;border:1px solid var(--blue);">
                    <thead><tr style="background:#e4f2fd;color:#1d83d4;">
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Nama Barang</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Berat</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Stock</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Harga</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Diskon</th>
                        <th style="padding:8px;text-align:center;border:1px solid var(--blue);">Aksi</th>
                    </tr></thead><tbody>${rows}</tbody>
                </table>`;
        }

        async function cariProduk() {
            const keyword = document.getElementById('searchInput').value.trim();
            const list = document.getElementById('produkList');
            if (keyword === '') { list.innerHTML = ''; return; }

            try {
                const res = await fetch(`${API_BASE}/products?search=${encodeURIComponent(keyword)}&limit=10`, { headers: authHeaders });
                if (!res.ok) throw new Error('Gagal memuat produk');
                produkData = await res.json();
                renderTabelProduk(produkData);
            } catch (err) {
                showToast(err.message, 'error');
                list.innerHTML = '<p class="empty-cart">Gagal memuat produk.</p>';
            }
        }

        function pilihProduk(idProduct) {
            const produk = produkData.find(p => p.idProduct === idProduct);
            if (!produk) return;
            produkDipilih = produk;
            const diCart = cart.find(c => c.idProduct === idProduct);
            const sisaStock = produk.stock - (diCart ? diCart.qty : 0);

            if (sisaStock <= 0) { showToast(`Stok habis.`, 'error'); return; }

            const panel = document.getElementById('panelPilih');
            panel.style.display = 'block';
            panel.innerHTML = `
                <div class="panel-pilih-inner">
                    <div class="panel-atas">
                        <span class="panel-nilai" style="color: var(--blue);">Barang Terpilih:</span>
                        <span class="panel-nilai" style="color: var(--blue); font-weight: bold;">${produk.name}</span>
                    </div>
                    <div class="panel-bawah">
                        <div class="panel-kiri">
                            <div class="panel-label">Harga Satuan:</div>
                            <div class="panel-harga">Rp ${produk.price.toLocaleString('id-ID')}</div>
                        </div>
                        <div class="panel-stock-kolom">
                            <div class="panel-label">Sisa Stock:</div>
                            <div class="panel-stock">${sisaStock}</div>
                        </div>
                        <div class="panel-kanan">
                            <div class="panel-qty-row">
                                <label class="panel-label">QTY:</label>
                                <input type="number" id="inputQty" class="input-qty" min="1" max="${sisaStock}" value="1">
                                <button class="btn-masukkan" onclick="masukkanKeCart()">Masukkan Keranjang</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            document.getElementById('inputQty').focus();
        }

        function masukkanKeCart() {
            if (!produkDipilih) return;
            const qty = parseInt(document.getElementById('inputQty').value, 10);
            if (isNaN(qty) || qty < 1) { showToast('Qty minimal 1!', 'error'); return; }

            const diCart = cart.find(c => c.idProduct === produkDipilih.idProduct);
            const sisaStock = produkDipilih.stock - (diCart ? diCart.qty : 0);
            if (qty > sisaStock) { showToast(`Sisa stok hanya ${sisaStock}!`, 'error'); return; }

            if (diCart) { diCart.qty += qty; } 
            else { cart.push({ ...produkDipilih, qty: qty }); }

            produkDipilih = null;
            document.getElementById('panelPilih').style.display = 'none';
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cartList');
            if (cart.length === 0) {
                cartList.innerHTML = '<p class="empty-cart">Belum ada barang dipilih.</p>';
            } else {
                const rows = cart.map(c => {
                    const subtotal = c.price * c.qty * (1 - c.discount / 100);
                    return `<tr>
                        <td style="padding:8px;border:1px solid var(--blue);">${c.name}</td>
                        <td style="padding:8px;border:1px solid var(--blue);">Rp ${c.price.toLocaleString('id-ID')}</td>
                        <td style="padding:8px;border:1px solid var(--blue);">${c.discount}%</td>
                        <td style="padding:8px;border:1px solid var(--blue);">${c.qty}</td>
                        <td style="padding:8px;border:1px solid var(--blue);">Rp ${subtotal.toLocaleString('id-ID')}</td>
                        <td style="padding:8px;text-align:center;border:1px solid var(--blue);"><button class="hapus-btn" onclick="hapusDariCart('${c.idProduct}')">Hapus</button></td>
                    </tr>`;
                }).join('');
                cartList.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:14px;border:1px solid var(--blue);">
                    <thead><tr style="background:#e4f2fd;color:#1d83d4;">
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Nama Barang</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Harga</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Diskon</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">QTY</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Subtotal</th>
                        <th style="padding:8px;text-align:center;border:1px solid var(--blue);">Aksi</th>
                    </tr></thead><tbody>${rows}</tbody></table>`;
            }
            const total = cart.reduce((sum, c) => sum + c.price * c.qty * (1 - c.discount / 100), 0);
            document.getElementById('totalHarga').textContent = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function hapusDariCart(idProduct) {
            cart = cart.filter(c => c.idProduct !== idProduct);
            renderCart();
        }

        async function bayar() {
            if (cart.length === 0) { showToast('Daftar belanja masih kosong!', 'error'); return; }
            if (!confirm('Yakin ingin memproses transaksi ini?')) return;

            const payload = {
                idPaymentMethod: parseInt(document.getElementById('metodePembayaran').value, 10),
                items: cart.map(c => ({ idProduct: c.idProduct, qty: c.qty }))
            };

            try {
                const res = await fetch(`${API_BASE}/transactions`, {
                    method: 'POST',
                    headers: authHeaders,
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.message || 'Transaksi gagal');

                showToast(`Berhasil! Invoice: ${result.invoiceNo}`, 'success');
                cart = [];
                renderCart();
                document.getElementById('searchInput').value = '';
                document.getElementById('produkList').innerHTML = '';
                
                document.getElementById('invoiceNo').textContent = result.invoiceNo;
                
                setTimeout(loadNextInvoice, 2000);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        const HISTORY_PER_PAGE = 20;
        let historyPage = 1;
        let historyFilterAktif = '';

        async function renderHistory(filterTanggal) {
            const historyList = document.getElementById('historyList');
            const pagination = document.getElementById('historyPagination');

            if (filterTanggal !== undefined) { historyFilterAktif = filterTanggal; historyPage = 1; }

            let dateParam = '';
            if (historyFilterAktif && historyFilterAktif.trim() !== '') {
                const clean = historyFilterAktif.replace(/\s/g, '').replace(/-/g, '/');
                const parts = clean.split('/');
                if (parts.length === 3) dateParam = `${parts[2]}-${parts[1]}-${parts[0]}`;
            }

            try {
                const url = new URL(`${API_BASE}/transactions`);
                url.searchParams.set('page', historyPage);
                url.searchParams.set('pageSize', HISTORY_PER_PAGE);
                if (dateParam) url.searchParams.set('date', dateParam);

                const res = await fetch(url, { headers: authHeaders });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Gagal memuat history');

                if (!data.items || data.items.length === 0) {
                    historyList.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--text-muted); font-style: italic;">Tidak ada transaksi pada tanggal tersebut.</div>';
                    pagination.innerHTML = ''; 
                    return;
                }

                const rows = data.items.map(r => {
                    const tgl = new Date(r.transactionDate);
                    const waktu = `${String(tgl.getDate()).padStart(2, '0')}-${String(tgl.getMonth() + 1).padStart(2, '0')}-${tgl.getFullYear()} ${String(tgl.getHours()).padStart(2, '0')}:${String(tgl.getMinutes()).padStart(2, '0')}`;
                    const safeKasir = new Option(r.kasir).innerHTML; 

                    return `<tr>
                        <td style="padding:8px;border:1px solid var(--blue);">${r.invoiceNo}</td>
                        <td style="padding:8px;border:1px solid var(--blue);">${waktu}</td>
                        <td style="padding:8px;border:1px solid var(--blue);">${safeKasir}</td>
                        <td style="padding:8px;border:1px solid var(--blue);">${r.totalItems}</td>
                        <td style="padding:8px;border:1px solid var(--blue);">${r.paymentMethod}</td>
                        <td style="padding:8px;border:1px solid var(--blue);">Rp ${r.totalPrice.toLocaleString('id-ID')}</td>
                    </tr>`;
                }).join('');

                historyList.innerHTML = `<div class="history-table-wrap"><table style="width:100%;border-collapse:collapse;font-size:14px;border:1px solid var(--blue);">
                    <thead><tr style="background:#e4f2fd;color:#1d83d4;">
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">No. Transaksi</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Tanggal &amp; Jam</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Kasir</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Jml Item</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Pembayaran</th>
                        <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Total Harga</th>
                    </tr></thead><tbody>${rows}</tbody></table></div>`;
                renderPagination(data.totalPages, data.currentPage);
            } catch (err) {
                showToast(err.message, 'error');
                historyList.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--danger); font-style: italic;">Gagal memuat data. Pastikan format tanggal benar.</div>';
                pagination.innerHTML = '';
            }
        }

        function renderPagination(totalHalaman, currentPage) {
            const pagination = document.getElementById('historyPagination');
            if (totalHalaman < 1) { pagination.innerHTML = ''; return; }
            let html = '';
            for (let i = 1; i <= totalHalaman; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="gotoHistoryPage(${i})">${i}</button>`;
            }
            pagination.innerHTML = html;
        }

        function gotoHistoryPage(page) {
            historyPage = page;
            renderHistory();
        }

        function cariHistory() {
            const tglInput = document.getElementById('filterTanggal').value.trim();
            
            if (tglInput === '') {
                renderHistory('');
                return;
            }

            const parts = tglInput.replace(/\s/g, '').split('/');
            
            if (parts.length !== 3 || parts[0].length !== 2 || parts[1].length !== 2 || parts[2].length !== 4) {
                showToast('Format tanggal salah! Gunakan format: dd / mm / yyyy (contoh: 23 / 10 / 2026)', 'error');
                return; 
            }

            const d = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10) - 1; 
            const y = parseInt(parts[2], 10);
            
            const dateObj = new Date(y, m, d);
            if (dateObj.getFullYear() !== y || dateObj.getMonth() !== m || dateObj.getDate() !== d) {
                showToast('Tanggal tidak valid di kalender!', 'error');
                return; 
            }

            renderHistory(tglInput);
        }

        document.addEventListener('DOMContentLoaded', function () {
            const pick = document.getElementById('filterTanggalPicker');
            if (pick) {
                pick.addEventListener('change', function () {
                    if (!pick.value) return;
                    const d = new Date(pick.value);
                    document.getElementById('filterTanggal').value = `${String(d.getDate()).padStart(2, '0')} / ${String(d.getMonth() + 1).padStart(2, '0')} / ${d.getFullYear()}`;
                });
            }
            loadPaymentMethods();
            loadNextInvoice();
        });
        
        const labelKasir = document.getElementById('labelKasir');
        if (labelKasir && currentUser) labelKasir.innerHTML = `<i>(Menampilkan Semua Kasir)</i>`;

        document.getElementById('produkList').innerHTML = '';
        renderCart();
    </script>
</body>
</html>
