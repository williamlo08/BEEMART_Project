<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BeeMart/Admin</title>
</head>
<body class="cashier-page">
    <nav class="navbar">
        <p class="logo">BeeMart</p>
        <div class="nav-right">
            <span id="headerInfo" style="color: white; font-size: 14px; margin-right: 15px; font-weight: bold;"></span>
            <a href="#" class="logout-btn" onclick="logout();return false;">Logout</a>
        </div>
    </nav>
    <div class="kotak">
        <!-- Tab Switch -->
        <div class="tab-switch">
            <button class="tab-btn active" id="tabNew" onclick="switchTab('new')">New Transaction</button>
            <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">History Transaction</button>
        </div>

        <!-- Konten New Transaction -->
        <div id="contentNew">
            <div class="invoice-row">
                <span class="invoice-label">Invoice No:</span>
                <span class="invoice-no" id="invoiceNo">-</span>
            </div>
            <div class="text-cari">
                <p style="font-size:14px">Cari Barang (Ketik: Apel / Susu, lalu tekan enter)</p>
            </div>

            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Ketik nama barang..." onkeydown="if(event.key==='Enter'){event.preventDefault();cariProduk();}">
            </div>

            <div class="produk-list" id="produkList"></div>

            <!-- Panel pilih qty (muncul saat klik Pilih) -->
            <div id="panelPilih" class="panel-pilih" style="display:none;"></div>

            <div class="daftar-belanja">
                <h4>Daftar Belanjaan</h4>
                <div id="cartList" class="cart-list">
                    <p class="empty-cart">Belum ada barang dipilih.</p>
                </div>
            </div>

            <div class="total-row">
                <span style="color: var(--blue);">Total:</span>
                <span id="totalHarga">Rp 0</span>
            </div>
            <div class="metode-row">
                <label for="metodePembayaran" class="metode-label">Metode Pembayaran:</label>
                <select id="metodePembayaran" class="metode-select">
                    <!-- diisi otomatis dari API -->
                </select>
            </div>

            <button class="bayar-btn" onclick="bayar()">Submit Transaksi</button>
        </div>

        <!-- Konten History Transaction -->
        <div id="contentHistory" style="display:none;">
            <div class="history-header">
                <p class="history-title">Pencarian Data Transaksi <span class="history-kasir" id="labelKasir">(Kasir: -)</span></p>
                <div class="history-filter">
                    <label for="filterTanggal" class="history-filter-label">Pilih Tanggal:</label>
                    <div class="history-date-wrap">
                        <input type="text" id="filterTanggal" class="history-date-input" placeholder="dd / mm / yyyy">
                        <input type="date" id="filterTanggalPicker" class="history-date-picker">
                        <span class="history-cal-icon" onclick="document.getElementById('filterTanggalPicker').showPicker ? document.getElementById('filterTanggalPicker').showPicker() : document.getElementById('filterTanggalPicker').click()">📅</span>
                    </div>
                    <button class="history-cari-btn" onclick="cariHistory()">Cari Data</button>
                </div>
            </div>
            <div class="history-list" id="historyList">
                <p class="empty-cart">Belum ada transaksi.</p>
            </div>
            <div class="history-pagination" id="historyPagination"></div>
        </div>
    </div>
    <script>
        // ===== Konfigurasi API =====
        const API_BASE = 'http://localhost:5046/api/v1';

        // ===== Ambil user yang login dari localStorage =====
        function getCurrentUser() {
            const raw = localStorage.getItem('currentUser');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch { return null; }
        }

        const currentUser = getCurrentUser();
        if (!currentUser) {
            // Belum login → redirect ke halaman login
            window.location.href = 'index.html';
        }

        const CURRENT_USER_ID = currentUser ? currentUser.idUser : null;

        // ===== Logout =====
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // ===== Toast (pengganti alert) =====
        function showToast(message, type = 'info') {
            const colors = {
                success: '#1d83d4',
                error: '#f84131',
                info: '#005499'
            };
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 20px;
                background: ${colors[type] || colors.info};
                color: white;
                border-radius: 8px;
                font-weight: bold;
                font-size: 14px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                z-index: 9999;
                max-width: 350px;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ===== Tanggal realtime di navbar =====
        // ===== Update Tampilan Kanan Atas (Dinamis) =====
        function updateHeader() {
            const header = document.getElementById('headerInfo');
            if (!currentUser || !header) return;

            // Cek tab mana yang sedang aktif
            const isHistoryTab = document.getElementById('tabHistory').classList.contains('active');

            if (isHistoryTab) {
                header.innerHTML = `Role : <span style="color: #e6e36a; font-weight: bold;">${currentUser.role}</span> | Login : ${currentUser.fullName}`;
            } else {
                // Tampilan saat di tab New Transaction (Dengan Jam)
                const sekarang = new Date();
                const tanggal = String(sekarang.getDate()).padStart(2, '0');
                const bulan = String(sekarang.getMonth() + 1).padStart(2, '0');
                const tahun = sekarang.getFullYear();
                const jam = String(sekarang.getHours()).padStart(2, '0');
                const menit = String(sekarang.getMinutes()).padStart(2, '0');
                
                // Format: 24/10/2025, 10:35 | Kasir : (Nama)
                header.textContent = `${tanggal}/${bulan}/${tahun}, ${jam}:${menit} | ${currentUser.role} : ${currentUser.fullName}`;
            }
        }

        // Jalankan jamnya setiap detik (hanya akan berdetak jika di tab New)
        setInterval(updateHeader, 1000);
        updateHeader();

        // ===== State =====
        let produkData = [];
        let cart = [];
        let produkDipilih = null;

        // ===== Ambil metode pembayaran dari API =====
        async function loadPaymentMethods() {
            try {
                const res = await fetch(`${API_BASE}/payment-methods`);
                if (!res.ok) throw new Error('Gagal memuat metode pembayaran');
                const methods = await res.json();
                const select = document.getElementById('metodePembayaran');
                select.innerHTML = methods.map(m =>
                    `<option value="${m.idPaymentMethod}">${m.methodName}</option>`
                ).join('');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ===== Tab Switch =====
        function switchTab(tab) {
            const newContent = document.getElementById('contentNew');
            const historyContent = document.getElementById('contentHistory');
            const tabNew = document.getElementById('tabNew');
            const tabHistory = document.getElementById('tabHistory');

            if (tab === 'new') {
                newContent.style.display = 'block';
                historyContent.style.display = 'none';
                tabNew.classList.add('active');
                tabHistory.classList.remove('active');
            } else {
                newContent.style.display = 'none';
                historyContent.style.display = 'block';
                tabNew.classList.remove('active');
                tabHistory.classList.add('active');
                renderHistory();
            }
            
            updateHeader(); 
        }

        // ===== Render tabel produk =====
        function renderTabelProduk(filtered) {
            const list = document.getElementById('produkList');

            if (filtered.length === 0) {
                list.innerHTML = '<p class="empty-cart">Barang tidak ditemukan.</p>';
                return;
            }

            const rows = filtered.map(p => `
                <tr>
                    <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${p.name}</td>
                    <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${p.weight} g</td>
                    <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${p.stock}</td>
                    <td style="padding:8px;text-align:left;border:1px solid var(--blue);">Rp ${p.price.toLocaleString('id-ID')}</td>
                    <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${p.discount}%</td>
                    <td style="padding:8px;text-align:center;border:1px solid var(--blue);"><button class="btn-pilih" onclick="pilihProduk('${p.idProduct}')">Pilih</button></td>
                </tr>
            `).join('');

            list.innerHTML = `
                <table style="width:100%;border-collapse:collapse;font-size:14px;border:1px solid var(--blue);">
                    <thead>
                        <tr style="background:#e4f2fd;color:#1d83d4;">
                            <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Nama Barang</th>
                            <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Berat</th>
                            <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Stock</th>
                            <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Harga</th>
                            <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Diskon</th>
                            <th style="padding:8px;text-align:center;border:1px solid var(--blue);">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>
            `;
        }

        // ===== Cari produk via API =====
        async function cariProduk() {
            const keyword = document.getElementById('searchInput').value.trim();
            const list = document.getElementById('produkList');

            if (keyword === '') {
                list.innerHTML = '';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/products?search=${encodeURIComponent(keyword)}&limit=10`);
                if (!res.ok) throw new Error('Gagal memuat produk');
                produkData = await res.json();
                renderTabelProduk(produkData);
            } catch (err) {
                showToast(err.message, 'error');
                list.innerHTML = '<p class="empty-cart">Gagal memuat produk.</p>';
            }
        }

        // ===== Pilih produk → panel qty =====
        function pilihProduk(idProduct) {
            const produk = produkData.find(p => p.idProduct === idProduct);
            if (!produk) return;

            produkDipilih = produk;

            const diCart = cart.find(c => c.idProduct === idProduct);
            const sisaStock = produk.stock - (diCart ? diCart.qty : 0);

            if (sisaStock <= 0) {
                showToast(`Stock ${produk.name} habis atau sudah semua di keranjang.`, 'error');
                return;
            }

            const panel = document.getElementById('panelPilih');
            panel.style.display = 'block';
            panel.innerHTML = `
                <div class="panel-pilih-inner">
                    <div class="panel-atas">
                        <span class="panel-nilai" style="color: var(--blue);">Barang Terpilih:</span>
                        <span class="panel-nilai" style="color: var(--blue); font-weight: bold;">${produk.name}</span>
                    </div>
                    <div class="panel-bawah">
                        <div class="panel-kiri">
                            <div class="panel-label">Harga Satuan:</div>
                            <div class="panel-harga">Rp ${produk.price.toLocaleString('id-ID')}</div>
                        </div>
                        <div class="panel-stock-kolom">
                            <div class="panel-label">Sisa Stock:</div>
                            <div class="panel-stock">${sisaStock}</div>
                        </div>
                        <div class="panel-kanan">
                            <div class="panel-qty-row">
                                <label class="panel-label" for="inputQty">QTY:</label>
                                <input type="number" id="inputQty" class="input-qty" min="1" max="${sisaStock}" value="1">
                                <button class="btn-masukkan" onclick="masukkanKeCart()">Masukkan Keranjang</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const inp = document.getElementById('inputQty');
            if (inp) inp.focus();
        }

        // ===== Masukkan ke cart =====
        function masukkanKeCart() {
            if (!produkDipilih) return;

            const inputQty = document.getElementById('inputQty');
            let qty = parseInt(inputQty.value, 10);

            if (isNaN(qty) || qty < 1) {
                showToast('Qty minimal 1!', 'error');
                return;
            }

            const diCart = cart.find(c => c.idProduct === produkDipilih.idProduct);
            const sudahAda = diCart ? diCart.qty : 0;
            const sisaStock = produkDipilih.stock - sudahAda;

            if (qty > sisaStock) {
                showToast(`Sisa stock hanya ${sisaStock}!`, 'error');
                return;
            }

            if (diCart) {
                diCart.qty += qty;
            } else {
                cart.push({
                    idProduct: produkDipilih.idProduct,
                    name: produkDipilih.name,
                    price: produkDipilih.price,
                    discount: produkDipilih.discount,
                    qty: qty
                });
            }

            produkDipilih = null;
            const panel = document.getElementById('panelPilih');
            panel.style.display = 'none';
            panel.innerHTML = '';

            renderCart();
        }

        // ===== Render cart =====
        function renderCart() {
            const cartList = document.getElementById('cartList');

            if (cart.length === 0) {
                cartList.innerHTML = '<p class="empty-cart">Belum ada barang dipilih.</p>';
            } else {
                const rows = cart.map(c => {
                    const subtotal = c.price * c.qty * (1 - c.discount / 100);
                    return `
                        <tr>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${c.name}</td>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">Rp ${c.price.toLocaleString('id-ID')}</td>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${c.discount}%</td>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${c.qty}</td>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">Rp ${subtotal.toLocaleString('id-ID')}</td>
                            <td style="padding:8px;text-align:center;border:1px solid var(--blue);"><button class="hapus-btn" onclick="hapusDariCart('${c.idProduct}')">Hapus</button></td>
                        </tr>
                    `;
                }).join('');

                cartList.innerHTML = `
                    <table style="width:100%;border-collapse:collapse;font-size:14px;border:1px solid var(--blue);">
                        <thead>
                            <tr style="background:#e4f2fd;color:#1d83d4;">
                                <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Nama Barang</th>
                                <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Harga</th>
                                <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Diskon</th>
                                <th style="padding:8px;text-align:left;border:1px solid var(--blue);">QTY</th>
                                <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Subtotal</th>
                                <th style="padding:8px;text-align:center;border:1px solid var(--blue);">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                `;
            }

            const total = cart.reduce((sum, c) => sum + c.price * c.qty * (1 - c.discount / 100), 0);
            document.getElementById('totalHarga').textContent = `Rp ${total.toLocaleString('id-ID')}`;
        }

        // ===== Hapus dari cart =====
        function hapusDariCart(idProduct) {
            cart = cart.filter(c => c.idProduct !== idProduct);
            renderCart();
        }

        // ===== Bayar =====
        async function bayar() {
            if (cart.length === 0) {
                showToast('Daftar belanja masih kosong!', 'error');
                return;
            }

            if (!confirm('Yakin ingin memproses transaksi ini?')) return;

            const metode = parseInt(document.getElementById('metodePembayaran').value, 10);

            const payload = {
                idUser: CURRENT_USER_ID,
                idPaymentMethod: metode,
                items: cart.map(c => ({
                    idProduct: c.idProduct,
                    qty: c.qty
                }))
            };

            try {
                const res = await fetch(`${API_BASE}/transactions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'Transaksi gagal diproses');
                }

                const result = await res.json();

                showToast(`Transaksi berhasil! Invoice: ${result.invoiceNo}`, 'success');

                cart = [];
                produkDipilih = null;
                document.getElementById('panelPilih').style.display = 'none';
                document.getElementById('panelPilih').innerHTML = '';
                renderCart();
                document.getElementById('searchInput').value = '';
                document.getElementById('produkList').innerHTML = '';
                document.getElementById('invoiceNo').textContent = result.invoiceNo;

            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ===== Pagination state =====
        const HISTORY_PER_PAGE = 20;
        let historyPage = 1;
        let historyFilterAktif = '';

        // ===== Render history dari API =====
        async function renderHistory(filterTanggal) {
            const historyList = document.getElementById('historyList');
            const pagination = document.getElementById('historyPagination');

            if (filterTanggal !== undefined) {
                historyFilterAktif = filterTanggal;
                historyPage = 1;
            }

            let dateParam = '';
            if (historyFilterAktif && historyFilterAktif.trim() !== '') {
                const clean = historyFilterAktif.replace(/\s/g, '').replace(/-/g, '/');
                const parts = clean.split('/');
                if (parts.length === 3) {
                    dateParam = `${parts[2]}-${parts[1]}-${parts[0]}`;
                }
            }

            try {
                const url = new URL(`${API_BASE}/transactions`);
                url.searchParams.set('page', historyPage);
                url.searchParams.set('pageSize', HISTORY_PER_PAGE);
                if (dateParam) url.searchParams.set('date', dateParam);

                // Kasir: hanya transaksi miliknya sendiri
                // Admin: semua transaksi (tidak kirim idUser)
                if (currentUser && currentUser.role === 'Kasir') {
                    url.searchParams.set('idUser', currentUser.idUser);
                }

                const res = await fetch(url);
                if (!res.ok) throw new Error('Gagal memuat history');
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    historyList.innerHTML = '<p class="empty-cart">Belum ada transaksi.</p>';
                    pagination.innerHTML = '';
                    return;
                }

                const rows = data.items.map(r => {
                    const tgl = new Date(r.transactionDate);
                    const dd = String(tgl.getDate()).padStart(2, '0');
                    const mm = String(tgl.getMonth() + 1).padStart(2, '0');
                    const yyyy = tgl.getFullYear();
                    const hh = String(tgl.getHours()).padStart(2, '0');
                    const mi = String(tgl.getMinutes()).padStart(2, '0');
                    const waktu = `${dd}-${mm}-${yyyy} ${hh}:${mi}`;

                    return `
                        <tr>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${r.invoiceNo}</td>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${waktu}</td>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${r.kasir || '-'}</td>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${r.totalItems}</td>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">${r.paymentMethod || '-'}</td>
                            <td style="padding:8px;text-align:left;border:1px solid var(--blue);">Rp ${r.totalPrice.toLocaleString('id-ID')}</td>
                        </tr>
                    `;
                }).join('');

                historyList.innerHTML = `
                    <div class="history-table-wrap">
                        <table style="width:100%;border-collapse:collapse;font-size:14px;border:1px solid var(--blue);">
                            <thead>
                                <tr style="background:#e4f2fd;color:#1d83d4;">
                                    <th style="padding:8px;text-align:left;border:1px solid var(--blue);">No. Transaksi</th>
                                    <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Tanggal &amp; Jam</th>
                                    <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Kasir</th>
                                    <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Jml Item</th>
                                    <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Pembayaran</th>
                                    <th style="padding:8px;text-align:left;border:1px solid var(--blue);">Total Harga</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                `;

                renderPagination(data.totalPages, data.currentPage);

            } catch (err) {
                showToast(err.message, 'error');
                historyList.innerHTML = '<p class="empty-cart">Gagal memuat history.</p>';
                pagination.innerHTML = '';
            }
        }

        // ===== Render pagination =====
        function renderPagination(totalHalaman, currentPage) {
            const pagination = document.getElementById('historyPagination');

            if (totalHalaman < 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';

            if (totalHalaman <= 9) {
                for (let i = 1; i <= totalHalaman; i++) {
                    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="gotoHistoryPage(${i})">${i}</button>`;
                }
            } else {
                for (let i = 1; i <= 8; i++) {
                    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="gotoHistoryPage(${i})">${i}</button>`;
                }

                html += `
                    <div class="page-more" id="pageMore">
                        <button class="page-more-btn" onclick="togglePageMore(event)">...</button>
                        <div class="page-more-menu" id="pageMoreMenu">
                            ${Array.from({ length: totalHalaman - 8 }, (_, k) => {
                                const n = k + 9;
                                return `<button class="${n === currentPage ? 'active' : ''}" onclick="gotoHistoryPage(${n})">${n}</button>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            pagination.innerHTML = html;
        }

        function togglePageMore(e) {
            e.stopPropagation();
            const menu = document.getElementById('pageMoreMenu');
            if (menu) menu.classList.toggle('show');
        }

        document.addEventListener('click', function (e) {
            const more = document.getElementById('pageMore');
            const menu = document.getElementById('pageMoreMenu');
            if (more && menu && !more.contains(e.target)) {
                menu.classList.remove('show');
            }
        });

        function gotoHistoryPage(page) {
            historyPage = page;
            renderHistory();
        }

        function cariHistory() {
            const tgl = document.getElementById('filterTanggal').value;
            renderHistory(tgl);
        }

        // ===== Init =====
        document.addEventListener('DOMContentLoaded', function () {
            const txt = document.getElementById('filterTanggal');
            const pick = document.getElementById('filterTanggalPicker');

            if (pick) {
                pick.addEventListener('change', function () {
                    if (!pick.value) return;
                    const d = new Date(pick.value);
                    const dd = String(d.getDate()).padStart(2, '0');
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const yyyy = d.getFullYear();
                    txt.value = `${dd} / ${mm} / ${yyyy}`;
                });
            }

            // ===== OPSIONAL: Admin langsung ke tab History & sembunyikan New Transaction =====
